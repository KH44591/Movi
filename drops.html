<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drops — MOVI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo-wrap"><img src="logo.png" alt="MOVI" class="nav-logo" /></a>
      <div class="nav-links">
        <a href="drops.html">Drops</a>
        <a href="about.html">About</a>
        <a href="preorder.html" class="nav-cta">Preorder</a>
      </div>
      <button class="burger" id="burger"><span></span><span></span><span></span></button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="drops.html">Drops</a><a href="about.html">About</a><a href="preorder.html">Preorder</a>
    </div>
  </nav>

  <div class="page-header">
    <h1>ALL<br>DROPS</h1>
    <p>Every MOVI release — past, present, and upcoming</p>
  </div>

  <div class="drops-page-container" id="dropsContainer"></div>

  <section class="manifesto">
    <div class="manifesto-inner">
      <img src="logo.png" alt="MOVI" class="manifesto-logo" />
      <p class="manifesto-text">Every drop. One chance.<br>Miss it and it's gone.</p>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="logo.png" alt="MOVI" class="footer-logo-img" />
        <p class="footer-tag">Move Different.</p>
      </div>
      <div class="footer-links">
        <a href="index.html">Home</a><a href="preorder.html">Preorder</a><a href="about.html">About</a>
      </div>
      <p class="footer-copy">© 2025 MOVI. All rights reserved.</p>
    </div>
  </footer>

  <script src="drops-data.js"></script>
  <script src="main.js"></script>
  <script>
  (function() {
    const container = document.getElementById('dropsContainer');

    MOVI_DROPS.forEach(drop => {
      const isOpen = drop.status === 'open';
      const isSold = drop.status === 'sold';
      const isSoon = drop.status === 'soon';

      const statusMap = {
        open: '<span class="drop-status status-open">● Preorder Open</span>',
        sold: '<span class="drop-status status-sold">— Sold Out</span>',
        soon: '<span class="drop-status status-soon">◌ Coming Soon</span>',
      };
      const ctaHtml = isOpen
        ? `<a href="preorder.html" class="btn-primary">Preorder — ৳${drop.price.toLocaleString()} →</a>`
        : isSold
          ? `<span class="btn-outline" style="opacity:0.4;cursor:default;display:inline-block;">Sold Out</span>`
          : `<button class="btn-outline" onclick="notifyMe()">Notify Me →</button>`;

      // ── Build shoe cards with view switcher ──
      let shoesHtml = '';
      if (drop.shoes.length === 0) {
        shoesHtml = `<div class="shoes-grid single-shoe">
          <div class="shoe-card">
            <div class="shoe-card-stage" style="background:${STAGE_BACKGROUNDS.dark}">
              <span class="tba-text">???</span>
            </div>
            <div class="shoe-card-info"><p class="shoe-card-color">TBA</p></div>
          </div></div>`;
      } else {
        const gridClass = drop.shoes.length === 1 ? 'single-shoe'
                        : drop.shoes.length === 2 ? 'two-shoes'
                        : drop.shoes.length <= 4  ? 'four-shoes'
                        : 'many-shoes';

        const cards = drop.shoes.map((shoe, si) => {
          const bg = shoe.stage === 'custom' ? shoe.bg_color : (STAGE_BACKGROUNDS[shoe.stage] || STAGE_BACKGROUNDS.dark);
          const firstImg = shoe.views && shoe.views[0] ? shoe.views[0].image : '';
          const stageId = `stage-${drop.id}-${si}`;
          const imgId   = `img-${drop.id}-${si}`;
          const soldOut = shoe.stock === 0 || isSold;

          // View switcher buttons
          const viewBtns = shoe.views && shoe.views.length > 1
            ? `<div class="view-switcher">
                ${shoe.views.map((v, vi) => `
                  <button class="view-btn ${vi===0?'view-active':''}"
                    onclick="switchView('${stageId}','${imgId}','${v.image}','${bg}',this)"
                    title="${v.label}">${v.label}</button>`).join('')}
              </div>` : '';

          return `
            <div class="shoe-card ${soldOut?'shoe-sold':''}">
              <div class="shoe-card-stage" id="${stageId}" style="background:${bg}">
                ${isSold ? '<span class="sold-tag">SOLD OUT</span>' : ''}
                <img id="${imgId}" src="${firstImg}" alt="${drop.name} ${shoe.color}"
                  class="shoe-card-img ${isSold?'grayscale':''}"
                  style="transition:opacity 0.18s ease, transform 0.18s ease;" />
                <div class="shoe-card-floor"></div>
              </div>
              ${viewBtns}
              <div class="shoe-card-info">
                <p class="shoe-card-color">${shoe.color}</p>
                ${!isSold && !isSoon ? `<p class="shoe-card-stock">${shoe.stock > 0 ? shoe.stock+' left' : 'Sold Out'}</p>` : ''}
                ${isOpen && shoe.stock > 0 ? `<a href="preorder.html?color=${encodeURIComponent(shoe.color)}" class="shoe-cta">Preorder →</a>` : ''}
              </div>
            </div>`;
        }).join('');

        shoesHtml = `<div class="shoes-grid ${gridClass}">${cards}</div>`;
      }

      const section = document.createElement('section');
      section.className = 'drop-section';
      section.id = drop.id;
      section.innerHTML = `
        <div class="drop-section-header">
          <div class="drop-section-meta">
            <span class="drop-section-num">DROP ${drop.number}</span>
            ${statusMap[drop.status]}
          </div>
          <h2 class="drop-section-name">${drop.name}</h2>
          <p class="drop-section-desc">${drop.description}</p>
          <div class="drop-section-actions">
            ${ctaHtml}
            ${drop.pairs_total ? `<span class="drop-pairs-badge">${drop.pairs_total} pairs · ৳${drop.price?drop.price.toLocaleString():'TBA'}</span>` : ''}
          </div>
        </div>
        ${shoesHtml}`;
      container.appendChild(section);
    });

    window.notifyMe = function() {
      const email = prompt('Enter your email for drop notification:');
      if (email && email.includes('@')) alert("You're on the list!");
    };
  })();
  </script>
</body>
</html>
